<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROBLOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Patrick+Hand&family=Gaegu:wght@400;700&family=IM+Fell+English:ital@0;1&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#d90429; --red2:#ef233c; --deep:#8d0801; --ink:#14090b; --pink:#ffe3e6; --pink2:#ffc2cb; --paper:#fff7f7;
  --side:72px; --top:56px;
  --hand:'Patrick Hand','Gaegu',cursive; --disp:'Fredoka','Nunito',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}
.ph{display:grid;place-items:center;color:#fff;font-weight:800;text-align:center;overflow:hidden}

/* ---------- chrome ---------- */
#side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:#fff;border-right:1px solid var(--pink2);display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px;z-index:30}
.sb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink);padding:6px 0;width:100%}
.sb svg{width:26px;height:26px;fill:none;stroke:var(--red);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.sb:first-child svg{fill:var(--red)}
.sb:hover span{color:var(--red)}
.meav{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--pink2)}
.meav img,.meav .ph{width:100%;height:100%;object-fit:cover}
#top{position:fixed;left:var(--side);right:0;top:0;height:var(--top);background:#fff;border-bottom:1px solid var(--pink2);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:20}
.logo{font:900 22px/1 var(--disp);letter-spacing:.5px;color:var(--red);display:flex;align-items:center}
.logo i{display:inline-block;width:.62em;height:.62em;margin:0 1px;background:var(--red);transform:rotate(18deg);border-radius:2px;position:relative}
.logo i::after{content:'';position:absolute;inset:28%;background:#fff;border-radius:1px}
.search{flex:0 1 400px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--pink);border:1px solid var(--pink2);border-radius:10px;padding:0 12px;height:36px}
.search svg{width:18px;height:18px;fill:none;stroke:var(--red);stroke-width:2;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:15px;color:var(--ink)}
.user{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.5px;font-size:14px}
.topav{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--pink2)}
.topav img,.topav .ph{width:100%;height:100%;object-fit:cover}
.user .ic{width:24px;height:24px;fill:none;stroke:var(--red);stroke-width:1.8;stroke-linejoin:round}
#home,#game{margin-left:var(--side);padding-top:var(--top);min-height:100vh}
#home{padding-left:clamp(16px,3.5vw,128px);padding-right:clamp(16px,3.5vw,128px);padding-bottom:60px}

/* ---------- home ---------- */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--pink2);margin-top:6px}
.tab{background:none;border:0;padding:14px 12px 12px;font-size:16px;font-weight:700;color:#7a3b44;border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-color:var(--red)}
.friends{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:clamp(4px,.7vw,14px);margin:20px 0 6px}
.fr{min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center}
.av{position:relative;width:100%;aspect-ratio:1;border-radius:50%;background:var(--pink);border:2px solid var(--pink2)}
.av img,.av .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av .avph{font-size:clamp(18px,2.2vw,34px)}
.dot{position:absolute;right:2%;bottom:2%;width:20%;height:20%;min-width:10px;min-height:10px;border-radius:50%;background:#2ec27e;border:2px solid #fff}
.addav{display:grid;place-items:center;background:var(--pink)}
.addav svg{width:48%;height:48%;fill:none;stroke:var(--red);stroke-width:1.6;stroke-linecap:round}
.fn{margin-top:7px;font-size:clamp(9px,.66vw,12px);font-weight:800;line-height:1.15;width:100%;overflow-wrap:anywhere;word-break:break-word}
.fg{margin-top:2px;font-size:clamp(8.5px,.74vw,12px);font-weight:700;line-height:1.15;color:var(--red);width:100%;overflow-wrap:anywhere}
.sec{font-size:22px;font-weight:800;margin:30px 0 14px}
.chev{color:var(--red)}
.movies{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(10px,1.2vw,20px) clamp(10px,1.2vw,18px)}
.mv{min-width:0}
.mvimg{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--deep)}
.mvbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(14px) brightness(.8);transform:scale(1.25)}
.mvfg{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.mvph{width:100%;height:100%;padding:10px;font-size:clamp(11px,1vw,15px);line-height:1.2}
.mvt{margin-top:9px;font-weight:800;font-size:clamp(12px,1vw,15px);line-height:1.2;overflow-wrap:anywhere}
.mvr{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:clamp(11px,.9vw,14px);font-weight:700;color:#7a3b44}
.mvr svg{width:16px;height:16px;fill:none;stroke:var(--red);stroke-width:2;flex:none}
.continue{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(8px,.9vw,16px)}
.ct{display:block;min-width:0}
.ctimg{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--deep);transition:transform .18s,box-shadow .18s;border:2px solid transparent}
.ctimg img{width:100%;height:100%;object-fit:cover;display:block}
.ctph{width:100%;height:100%;display:grid;place-items:center;padding:6px;text-align:center;color:#fff;font-weight:800;font-size:12px;background:linear-gradient(135deg,var(--red),var(--deep))}
.ct:hover .ctimg,.ct:focus-visible .ctimg{transform:translateY(-3px) scale(1.04);border-color:var(--red);box-shadow:0 8px 18px rgba(217,4,41,.3)}
.ctt{margin-top:7px;font-weight:800;font-size:clamp(11px,.9vw,14px);line-height:1.2;overflow-wrap:anywhere}
.foot{text-align:center;color:#a05a63;font-size:14px;margin-top:50px}
@media (max-width:1250px){.continue{grid-template-columns:repeat(6,minmax(0,1fr))}.movies{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1100px){.friends{grid-template-columns:repeat(8,minmax(0,1fr))}.fn{font-size:12px}.fg{font-size:11px}}
@media (max-width:760px){
  :root{--side:0px}
  #side{top:auto;bottom:0;left:0;right:0;width:auto;height:58px;flex-direction:row;justify-content:space-around;padding:0;border-right:0;border-top:1px solid var(--pink2)}
  .sb{padding:4px 0;font-size:10px}
  #top{left:0;padding:0 12px;gap:8px}.search{display:none}.logo{margin-right:auto}
  #home,#game{padding-bottom:70px}
  .friends{grid-template-columns:repeat(5,minmax(0,1fr))}
  .movies{grid-template-columns:repeat(2,minmax(0,1fr))}
  .continue{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ---------- game page ---------- */
#game{background:#fff}
.g-hero{position:relative;min-height:230px;overflow:hidden;background:linear-gradient(135deg,#2a0509,var(--deep) 60%,var(--red));color:#fff;padding:22px clamp(16px,4vw,48px)}
.g-bg{position:absolute;inset:0}
.g-bgimg{width:100%;height:100%;object-fit:cover;filter:blur(16px) brightness(.5);transform:scale(1.2)}
.g-close{position:relative;z-index:3;width:46px;height:46px;border-radius:12px;border:0;background:rgba(20,9,11,.7);display:grid;place-items:center}
.g-close svg{width:22px;height:22px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.g-close:hover{background:var(--red)}
.g-head{position:relative;z-index:2;display:flex;gap:22px;align-items:flex-end;margin-top:14px;flex-wrap:wrap}
.g-thumb{width:clamp(110px,16vw,190px);aspect-ratio:1;border-radius:12px;overflow:hidden;border:3px solid #fff;background:var(--deep);flex:none}
.g-thumb img,.g-thumb .gph{width:100%;height:100%;object-fit:cover;padding:8px;font-size:14px}
.g-info{min-width:0;flex:1 1 260px}
.g-info h1{margin:0;font-size:clamp(24px,3.4vw,40px);line-height:1.1;font-weight:900;overflow-wrap:anywhere;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.g-mat{margin-top:6px;opacity:.85;font-weight:600}
.g-by{margin-top:4px;font-weight:900;letter-spacing:.6px;font-size:15px}
.g-play{margin-top:14px;width:min(100%,340px);height:50px;border:0;border-radius:12px;background:var(--red);display:grid;place-items:center;box-shadow:0 4px 0 var(--deep)}
.g-play svg{width:24px;height:24px;fill:#fff}
.g-play:hover{background:var(--red2)}
.g-flash{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:linear-gradient(135deg,#fff,var(--pink2));opacity:0;pointer-events:none;transition:opacity .12s}
.g-flash.on{opacity:1}
.g-flash .fa{font-size:clamp(84px,16vw,150px);filter:drop-shadow(0 6px 0 rgba(217,4,41,.18))}
.g-flash.on .fa{animation:hop .5s ease-out}
.g-flash i{position:absolute;color:var(--red);font-style:normal;font-size:34px}
.g-flash .s1{left:22%;top:24%}.g-flash .s2{right:24%;top:30%}.g-flash .s3{left:34%;bottom:18%}
.g-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px clamp(16px,4vw,48px);max-width:1200px;margin:0 auto}
.ratepill,.abtn{display:flex;align-items:center;gap:8px;height:40px;border-radius:999px;background:var(--pink);border:1px solid var(--pink2);padding:0 14px;font-weight:800;font-size:15px}
.ratepill{padding:0 4px;gap:2px}
.pill-b{width:38px;height:34px;border:0;background:none;border-radius:999px;display:grid;place-items:center}
.pill-b svg,.abtn svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.pill-b.on{background:var(--red)}.pill-b.on svg{stroke:#fff;fill:#fff}
.pct{padding:0 6px;border-left:1px solid var(--pink2);border-right:1px solid var(--pink2);line-height:34px}
.abtn:hover{background:var(--pink2)}
.abtn.on svg{fill:var(--red);stroke:var(--red)}
.abtn.ring svg{animation:ring .9s ease-in-out;transform-origin:50% 10%}
.g-stage{max-width:1200px;margin:6px auto 0;padding:0 clamp(12px,3vw,32px);min-height:62vh;position:relative}
.g-nextwrap{display:flex;justify-content:center;padding:34px 16px 60px}
.g-next{border:0;background:var(--red);color:#fff;font-weight:900;font-size:20px;letter-spacing:.5px;padding:16px 56px;border-radius:14px;box-shadow:0 5px 0 var(--deep)}
.g-next:hover{background:var(--red2)}
.g-next.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}

/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;pointer-events:none;z-index:200}
#overlay>*{pointer-events:auto}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:300}
#toast.on{opacity:1;transform:translate(-50%,0)}
.flashpic{position:fixed;inset:0;background:#14090b;animation:fin .18s ease-out}
.flashpic.out{opacity:0;transition:opacity .35s}
.flashimg{width:100%;height:100%;object-fit:cover;display:block}
.flashemoji{width:100%;height:100%;display:grid;place-items:center;font-size:min(60vw,60vh);background:linear-gradient(135deg,var(--red),var(--deep))}
.fxbox{position:fixed;inset:0;overflow:hidden;pointer-events:none!important}
.fstar{position:absolute;bottom:-60px;animation:starfly linear forwards}
.fstar svg{width:100%;height:100%;fill:#fff;stroke:var(--red);stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(217,4,41,.5))}
.fstar.red svg{fill:var(--red);stroke:#fff}
.conf{position:absolute;top:-40px;font-style:normal;animation:confall linear forwards}
.owlfly{position:fixed;left:0;top:0;width:clamp(90px,12vw,140px);animation:owlpath 8s ease-in-out forwards;pointer-events:none!important}
.owl{width:100%;overflow:visible}
.owl *{fill:#fff;stroke:#14090b;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.owl .pup circle{fill:#14090b}.owl .pup circle:nth-child(n+3){fill:#fff;stroke:none}
.owl .beak{fill:var(--red)}.owl .blush{fill:#ff8fa3;stroke:none}
.owl .fth path{fill:none;stroke-width:2}
.owl .wingL{transform-origin:34px 50px;animation:wingL .24s ease-in-out infinite alternate}
.owl .wingR{transform-origin:66px 50px;animation:wingR .24s ease-in-out infinite alternate}
.modal{position:fixed;inset:0;background:rgba(20,9,11,.6);display:grid;place-items:center;padding:16px;animation:fin .2s}
.modal.out{opacity:0;transition:.25s}
.modal-card{width:min(440px,100%);max-height:84vh;background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--red);color:#fff;font-size:18px}
.modal-x{width:34px;height:34px;border:0;border-radius:8px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.modal-x svg{width:18px;height:18px;stroke:#fff;stroke-width:2.6;fill:none}
.act-list{overflow:auto;padding:8px 14px 16px}
.act-row{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid var(--pink)}
.catav{position:relative;width:46px;height:46px;flex:none;border-radius:50%;background:var(--pink)}
.catav img,.catph{width:100%;height:100%;border-radius:50%;object-fit:cover;font-size:24px}
.catav .dot{width:13px;height:13px}
.act-n{display:flex;flex-direction:column;line-height:1.2}
.act-n small{color:#2a9d63;font-weight:800}

/* verdicts */
.verdict{position:fixed;inset:0;overflow:hidden;display:grid;place-items:center;animation:fin .25s}
.verdict.out{opacity:0;transition:opacity .5s}
.verdict.win{background:linear-gradient(#ffcf33,#d9a000)}
.verdict.lose{background:radial-gradient(#4a0a10,#14090b)}
.v-text{position:relative;z-index:3;max-width:min(780px,86vw);text-align:center;font:700 clamp(26px,4.6vw,52px)/1.2 var(--disp);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.4);background:rgba(20,9,11,.45);padding:26px 30px;border-radius:22px}
.v-sun{font-size:1.6em;margin-top:6px;animation:spinslow 4s linear infinite}
.seed{position:absolute;top:0;border-radius:50%/60%;background:linear-gradient(90deg,#14090b 0 22%,#fff 22% 36%,#14090b 36% 64%,#fff 64% 78%,#14090b 78%);border:2px solid #14090b;transform:rotate(var(--r));animation:seedDrop .9s cubic-bezier(.3,.8,.5,1) both}
.sadh{position:absolute;top:-90px;font-style:normal;animation:sadfall linear infinite;filter:saturate(.7)}
.bars{position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(90deg,transparent 0 62px,rgba(255,255,255,.18) 62px 72px);pointer-events:none}

/* letters */
.letter-m{background:rgba(20,9,11,.7)}
.letter{position:relative;width:min(94vw,660px);max-height:88vh;overflow:auto;padding:44px clamp(24px,5vw,54px) 30px;font-family:'IM Fell English',Georgia,serif;color:#3b2412;border:4px double #8b5a2b;animation:letterIn .5s cubic-bezier(.2,1.2,.4,1)}
.l-orn{text-align:center;font-size:30px;color:#8b2a1a;margin-bottom:6px}
.l-body{line-height:1.8;font-size:clamp(16px,1.9vw,20px);white-space:pre-line;overflow-wrap:anywhere}
.l-body.verse{text-align:center;font-style:italic;font-size:clamp(18px,2.2vw,24px)}
.l-close{display:block;margin:26px auto 0;background:#7a2e1d;color:#fbe9c9;border:2px solid #3a1008;padding:10px 24px;border-radius:4px;font-family:inherit;font-size:17px}
.l-close:hover{background:#9c3a25}
.letter.age1{background:radial-gradient(circle at 20% 15%,#fffaf0,#fbefd8 70%);box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 40px rgba(210,170,110,.25)}
.letter.age2{background:radial-gradient(circle at 80% 10%,rgba(160,110,50,.25),transparent 30%),radial-gradient(circle at 20% 15%,#f6e6c4,#efd9ae 70%);box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 0 60px rgba(150,100,40,.35);border-color:#7a4d1f}
.letter.age3{background:radial-gradient(circle at 70% 70%,rgba(110,70,30,.3),transparent 28%),radial-gradient(circle at 15% 20%,rgba(110,70,30,.25),transparent 22%),linear-gradient(#e2c895,#d6b57c);box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 0 80px rgba(110,70,30,.5);border-color:#6a4219;clip-path:polygon(0 1%,6% 0,14% 1.4%,25% 0,38% 1%,52% 0,66% 1.3%,80% 0,92% 1%,100% 0,99% 12%,100% 28%,98.8% 46%,100% 63%,99% 80%,100% 100%,88% 98.8%,72% 100%,55% 99%,40% 100%,24% 98.8%,10% 100%,0 99%,1.2% 82%,0 64%,1% 45%,0 26%,1.2% 10%)}
.letter.age4{background:radial-gradient(circle at 80% 20%,rgba(70,40,15,.45),transparent 30%),radial-gradient(circle at 20% 80%,rgba(70,40,15,.45),transparent 30%),linear-gradient(#c7a468,#b08a4f);box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 0 110px rgba(60,30,10,.7);border-color:#4a2c10;color:#2b1708;clip-path:polygon(0 3%,5% 0,11% 2.5%,19% .4%,30% 2.2%,41% 0,55% 2.6%,67% .5%,79% 2.4%,90% 0,100% 2.8%,98.6% 14%,100% 27%,98.4% 41%,100% 56%,98.8% 71%,100% 85%,98.5% 100%,90% 97.4%,78% 100%,64% 97.6%,50% 100%,37% 97.4%,25% 100%,12% 97.6%,0 100%,1.6% 86%,0 72%,1.5% 56%,0 40%,1.4% 24%,0 12%)}
.caret{display:inline-block;width:2px;height:1em;background:var(--red);margin-left:2px;vertical-align:-.12em;animation:blink .7s steps(1) infinite}

/* ---------- GAME 1: butterflies ---------- */
.g1{text-align:center}
.bf-count{display:inline-block;margin:6px 0 10px;background:var(--red);color:#fff;font-weight:900;border-radius:999px;padding:6px 18px}
.bf-hint{font-weight:700;color:#7a3b44;margin-bottom:10px;min-height:1.4em}
.bf-field{position:relative;height:min(62vh,520px);border-radius:20px;overflow:hidden;border:3px solid var(--ink);background:radial-gradient(circle at 20% 25%,#fff 0,#ffe3e6 45%,#ffc2cb 100%);touch-action:manipulation}
.bf-field::before{content:'✿ ❀ ✿ ❀ ✿';position:absolute;left:0;right:0;bottom:6px;color:var(--red);opacity:.35;letter-spacing:34px;font-size:34px;white-space:nowrap;overflow:hidden}
.bf-field.nope{animation:shk .4s}
.bfly{position:absolute;left:0;top:0;width:62px;cursor:pointer;will-change:transform}
.bfly svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 3px 2px rgba(20,9,11,.25))}
.wings{transform-origin:32px 24px;animation:flap .26s ease-in-out infinite alternate}
.bfly.caught svg{animation:caught .5s forwards}
.bfly.wiggle svg{animation:shk .4s}
.bf-msg{margin:24px auto 0;max-width:760px;opacity:0;transform:translateY(20px);transition:.7s}
.bf-msg.show{opacity:1;transform:none}
.bf-msgin{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:26px clamp(18px,4vw,38px);box-shadow:8px 8px 0 var(--red);text-align:left}
.bf-msgin p{margin:0;font:400 clamp(19px,2.2vw,24px)/1.55 var(--hand)}

/* ---------- GAME 2: jar ---------- */
.jar-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 16px;min-height:62vh;border-radius:20px;border:3px solid var(--ink);background:repeating-linear-gradient(45deg,#fff 0 18px,#fff2f4 18px 36px)}
.jar-left{font-weight:900;color:var(--red);font-size:18px}
.jar{width:min(260px,66vw);cursor:pointer;outline-offset:6px;transform-origin:50% 90%}
.jar svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 10px 8px rgba(20,9,11,.2))}
.jar.shaking{animation:jarShake .75s}
.jnote{transition:opacity .4s,transform .4s}.jnote.gone{opacity:0}
.jar-btn{border:0;background:var(--red);color:#fff;font-weight:900;font-size:18px;padding:12px 34px;border-radius:12px;box-shadow:0 4px 0 var(--deep)}
.jar-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.jar-hint{color:#7a3b44;font-weight:700}

/* ---------- GAME 3: matching ---------- */
.mt-info{text-align:center;font-weight:800;color:var(--red);margin:6px 0 16px}
.mt-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(8px,1.2vw,16px);max-width:860px;margin:auto;transition:.5s}
.mt-grid.away{opacity:0;transform:scale(.9)}
.mt-card{position:relative;aspect-ratio:3/4;padding:0;border:0;background:none;perspective:700px}
.mt-card .f{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;backface-visibility:hidden;transition:transform .45s}
.mt-card .front{background:var(--red);color:#fff;font-size:clamp(22px,3.4vw,40px);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.mt-card .back{background:#fff;color:var(--red);font:900 clamp(30px,6vw,68px) var(--disp);transform:rotateY(180deg);border:3px solid var(--red)}
.mt-card.flip .front{transform:rotateY(180deg)}.mt-card.flip .back{transform:rotateY(0)}
.mt-card.done .back{background:var(--pink);animation:pop .4s}
.mt-final{position:relative;min-height:56vh;display:grid;place-items:center;overflow:hidden;border-radius:20px;background:radial-gradient(circle,#fff,var(--pink))}
.mt-air span{position:absolute;animation:drift3 linear infinite alternate;opacity:.9}
.mt-line{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:0 4px;padding:10px}
.mt-line .pl{display:inline-block;font:900 clamp(54px,13vw,160px)/1 var(--disp);color:var(--red);text-shadow:4px 4px 0 var(--ink);animation:plpop .5s cubic-bezier(.2,1.6,.4,1)}
.mt-line .sp{display:inline-block;width:.35em}
@media (max-width:640px){.mt-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* ---------- GAME 4: hamster mystery ---------- */
.hm{background:#fffaf5;border:3px solid var(--ink);border-radius:18px;padding:clamp(16px,3vw,34px);font-family:'Nunito',sans-serif;background-image:radial-gradient(#f4d6d8 1.2px,transparent 1.2px);background-size:22px 22px}
.hm-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hm-tag{border:2px solid var(--ink);background:#fff;font-weight:900;font-size:12px;letter-spacing:1.2px;padding:6px 12px;border-radius:6px;opacity:1;cursor:not-allowed;color:var(--ink)}
.hm-tag:nth-child(1){background:var(--red);color:#fff}.hm-tag:nth-child(3){background:var(--ink);color:#fff}
.hm-title{text-align:center;font:900 clamp(28px,5.4vw,60px)/1.05 var(--disp);color:var(--red);margin:20px 0 22px;text-shadow:3px 3px 0 var(--ink)}
.hm-case{position:relative;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:26px clamp(16px,3vw,30px) 20px;box-shadow:7px 7px 0 var(--red)}
.hm-stamp{position:absolute;right:16px;top:-16px;transform:rotate(4deg);background:var(--red);color:#fff;font-weight:900;padding:6px 14px;border:3px solid var(--ink);border-radius:6px;letter-spacing:1px}
.hm-case h3{margin:0 0 12px;font:800 clamp(22px,3vw,32px) var(--disp)}
.hm-case dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:10px 18px}
.hm-case dt{font-weight:900;color:var(--red)}.hm-case dd{margin:0;line-height:1.45}
@media (max-width:640px){.hm-case dl{grid-template-columns:1fr;gap:2px}.hm-case dd{margin-bottom:8px}}
.hm-story{margin-top:22px}
.hm-story h4{margin:16px 0 4px;font-size:18px;color:var(--red)}.hm-story p{margin:0;line-height:1.6}
.hm-h{margin:34px 0 14px;font:800 clamp(22px,3vw,30px) var(--disp);border-bottom:3px solid var(--red);padding-bottom:6px}
.hm-sus{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.hm-card{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:14px;box-shadow:5px 5px 0 var(--pink2)}
.hm-ph{position:relative;aspect-ratio:1/.85;border-radius:10px;overflow:hidden;background:var(--pink)}
.hm-ph img,.hm-ph .hface{width:100%;height:100%;object-fit:cover}
.hface{font-size:clamp(60px,9vw,96px)}
.hm-no{position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px}
.hm-card h4{margin:12px 0 0;font:800 24px var(--disp)}.hm-role{color:var(--red);font-weight:800;font-size:14px;margin-bottom:6px}.hm-card p{margin:0;line-height:1.5;font-size:15px}
.hm-ev{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.hm-evi{background:#fff;border:3px dashed var(--red);border-radius:12px;padding:14px 16px}
.hm-evi b{display:inline-block;background:var(--red);color:#fff;padding:2px 10px;border-radius:6px;margin-bottom:6px}
.hm-evi p{margin:4px 0;line-height:1.5}.dn{color:#7a1b28}
.hm-wit{display:grid;gap:12px}
.hm-w{display:flex;gap:14px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:12px;align-items:flex-start}
.hm-w .wpic,.hm-w .hface{width:76px;height:76px;flex:none;border-radius:50%;object-fit:cover;font-size:40px}
.hm-w p{margin:4px 0 0;line-height:1.5}
.hm-ask{margin-top:36px;text-align:center;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:24px 16px}
.hm-ask h3{margin:0 0 16px;font:800 clamp(22px,3.4vw,34px) var(--disp)}
.hm-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;max-width:900px;margin:auto}
.hm-opt{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:12px;font-weight:900;font-size:17px;transition:transform .15s}
.hm-opt:hover:not(:disabled){transform:translateY(-4px) rotate(-1.5deg)}
.hm-opt:disabled{opacity:.6;cursor:default}.hm-opt.pick{opacity:1;outline:4px solid #ffd60a}
.hm-opt .optpic,.hm-opt .hface{width:84px;height:84px;border-radius:50%;object-fit:cover;font-size:44px}
.hm-result{margin-top:22px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:22px;box-shadow:7px 7px 0 var(--red)}
.hm-result h3{margin:0 0 12px;font:800 28px var(--disp);color:var(--red)}
.hm-cul{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.hm-cul .hpic,.hm-cul .hface{width:120px;height:120px;border-radius:14px;object-fit:cover;font-size:64px}
.hm-cul>div{flex:1 1 280px}.hm-cul p{margin:6px 0;line-height:1.6}
.hpic{object-fit:cover}

/* ---------- GAME 6: sharks (my world) ---------- */
.sk-wrap{position:relative;height:min(72vh,580px);border-radius:20px;overflow:hidden;border:3px solid var(--ink);background:radial-gradient(circle at 50% 10%,var(--red2),var(--deep) 85%)}
.sk-wrap::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 40px,rgba(255,255,255,.05) 40px 80px)}
.sk-txt{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(46px,11vw,140px) var(--disp);color:#fff;text-shadow:0 4px 0 rgba(20,9,11,.5);transition:opacity 1.6s}
.sk-txt.fade{opacity:0}
.sk-cv{position:absolute;inset:0;width:100%;height:100%}

/* ---------- GAME 7: rainbow ---------- */
.rb-info{text-align:center;font-weight:800;color:var(--red);margin:6px 0 10px}
.rb-svg{width:min(100%,780px);margin:auto;background:linear-gradient(#fff,var(--pink));border-radius:20px;border:3px solid var(--ink);padding:16px 10px 0}
.rb-arc{fill:none;stroke-linecap:butt;cursor:pointer;transition:filter .2s,opacity .2s}
.rb-arc:hover{opacity:.85}
.rb-arc.sel{filter:drop-shadow(0 0 7px var(--ink)) brightness(1.15);stroke-dasharray:14 6}
.rb-svg.solved .rb-arc{animation:wave 1.4s ease-in-out infinite alternate}
.rb-count{text-align:center;font-weight:700;color:#7a3b44;margin-top:8px}
.rb-msg{max-width:760px;margin:22px auto 0;opacity:0;transform:translateY(16px);transition:.7s;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:24px 28px;box-shadow:8px 8px 0 var(--red)}
.rb-msg.show{opacity:1;transform:none}
.rb-msg p{margin:0;font:400 clamp(19px,2.2vw,24px)/1.55 var(--hand)}

/* ---------- GAME 8: diary ---------- */
.dy{padding:6px 0 10px}
.dy-cover{position:relative;max-width:760px;aspect-ratio:4/3;margin:10px auto;border-radius:10px 26px 26px 10px;overflow:hidden;background:var(--deep) radial-gradient(circle at 30% 20%,var(--red),var(--deep));border:4px solid var(--ink);box-shadow:12px 12px 0 var(--pink2),inset 18px 0 0 rgba(20,9,11,.5);transition:transform .65s,opacity .65s;transform-origin:left center}
.dy-cover.opened{transform:perspective(900px) rotateY(-70deg);opacity:0}
.dy-doodles{position:absolute;inset:0}
.dy-d{position:absolute;color:#fff}
.dy-d img{width:100%;height:auto;background:#fff;border-radius:10px;padding:4px;border:2px solid var(--ink)}
.dy-cover .sdood{color:#fff}
.dy-label{position:absolute;inset:0;margin:auto;width:min(82%,440px);height:fit-content;background:#fff;border:4px solid var(--ink);border-radius:14px;padding:22px 20px;text-align:center;box-shadow:6px 6px 0 var(--ink);transform:rotate(-1.5deg)}
.dy-label h2{margin:0;font:700 clamp(34px,6vw,58px)/1 var(--hand);color:var(--red)}
.dy-label p{margin:8px 0 16px;font:400 clamp(17px,2.2vw,22px) var(--hand)}
.dy-open{border:0;background:var(--red);color:#fff;font-weight:900;padding:10px 24px;border-radius:10px;box-shadow:0 4px 0 var(--deep);font-size:16px}
.sdood{display:inline-block;color:var(--red)}.sdood svg{width:100%;height:auto;overflow:visible}
.dy-book{position:relative;display:grid;grid-template-columns:1fr 1fr;max-width:1020px;margin:10px auto;min-height:min(70vh,560px);perspective:1800px;border:4px solid var(--ink);border-radius:16px;background:var(--deep);padding:8px;box-shadow:10px 10px 0 var(--pink2)}
.dy-page{position:relative;overflow:hidden;padding:34px clamp(18px,3vw,38px) 34px;font-family:var(--hand);font-size:clamp(18px,1.9vw,24px);line-height:32px;background:repeating-linear-gradient(#fffdfd 0 31px,#f8cdd3 31px 32px)}
.dy-page.l{border-radius:10px 0 0 10px;box-shadow:inset -22px 0 24px -16px rgba(20,9,11,.25)}
.dy-page.l::before{content:'';position:absolute;left:44px;top:0;bottom:0;width:2px;background:rgba(217,4,41,.35);z-index:1}
.dy-page.r{border-radius:0 10px 10px 0;box-shadow:inset 22px 0 24px -16px rgba(20,9,11,.25)}
.dy-spine{position:absolute;left:50%;top:8px;bottom:8px;width:10px;margin-left:-5px;background:linear-gradient(90deg,rgba(20,9,11,.35),transparent 40%,transparent 60%,rgba(20,9,11,.35));z-index:3;pointer-events:none}
.ptx{position:relative;z-index:2;max-height:100%;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.dy-page.l .ptx{padding-left:22px}
.dood{position:absolute;right:20px;bottom:14px;z-index:1;opacity:.85}
.theend{font:700 clamp(40px,7vw,80px)/1.2 var(--hand);color:var(--red);text-align:center;padding-top:20%}
.dy-bar{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0 4px;min-height:48px}
.dy-no{font-weight:800;color:#7a3b44}
.dy-turn{border:0;background:var(--red);color:#fff;font-weight:900;padding:11px 28px;border-radius:12px;box-shadow:0 4px 0 var(--deep);animation:pop .4s}
.dy-flip{position:absolute;top:8px;bottom:8px;right:8px;width:calc(50% - 8px);transform-origin:left center;transform-style:preserve-3d;z-index:6;animation:pageflip .9s ease-in-out forwards;pointer-events:none}
.dy-flip .ff,.dy-flip .fb{position:absolute;inset:0;backface-visibility:hidden;background:repeating-linear-gradient(#fffdfd 0 31px,#f8cdd3 31px 32px);border-radius:0 10px 10px 0}
.dy-flip .fb{transform:rotateY(180deg);border-radius:10px 0 0 10px;box-shadow:inset -22px 0 24px -16px rgba(20,9,11,.3)}
@media (max-width:640px){.dy-page{font-size:16px;line-height:28px;padding:22px 12px;background:repeating-linear-gradient(#fffdfd 0 27px,#f8cdd3 27px 28px)}.dy-page.l .ptx{padding-left:6px}.dy-page.l::before{left:14px}}

/* diary effects: all drawn as red line-art */
.fxl{position:absolute;inset:0;overflow:hidden;pointer-events:none;color:var(--red);opacity:.6;z-index:0}
.fxl2{position:absolute;inset:0}
.fxi{position:absolute;display:block}
.fxi svg{width:100%;height:100%;overflow:visible}
.a-twinkle{animation:twinkle 3s ease-in-out infinite}
.a-fall{animation:fall 8s linear infinite}
.a-rise{animation:riseup 9s linear infinite}
.a-sway{animation:sway 3.5s ease-in-out infinite alternate;transform-origin:50% 100%}
.a-rain{animation:rain 1s linear infinite}
.a-float{animation:floaty 5s ease-in-out infinite alternate}
.a-drift{animation:drift 9s ease-in-out infinite alternate}
.a-drift2{animation:drift 16s ease-in-out infinite alternate;opacity:.6}
.a-pulse{animation:pulse 4s ease-out infinite}
.a-spin{animation:spin 14s linear infinite}
.a-flutter{animation:flutter 6s ease-in-out infinite alternate}
.moonfx{position:absolute;right:4%;top:3%;width:min(46%,230px);overflow:visible}
.moonfx .rays{animation:rayglow 4s ease-in-out infinite alternate}

/* ---------- GAME 9: math prank ---------- */
.mq{position:relative;min-height:68vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;overflow:hidden;border-radius:20px;border:3px solid var(--ink);background:#fff;padding:30px 16px;transition:background .3s;text-align:center}
.mq-bg{position:absolute;inset:0;color:var(--red);opacity:.35;pointer-events:none}
.mq-f,.mq-s{position:absolute;animation:floaty 6s ease-in-out infinite alternate;font-family:'Fredoka',sans-serif;font-weight:500;white-space:nowrap}
.mq-s svg{width:100%;height:auto}
.mq-t{position:relative;font:700 clamp(32px,7vw,84px)/1.1 var(--disp);color:var(--red);text-shadow:3px 3px 0 var(--ink)}
.mq-t span{display:inline-block;animation:bounceL 1.1s ease-in-out infinite}
.mq.bright{background:linear-gradient(135deg,#ff0054,#ff5400 55%,#ffbd00)}
.mq.bright .mq-bg{color:#fff;opacity:.4}
.mq-psy{position:relative;font:900 clamp(56px,13vw,150px)/1 var(--disp);color:#fff;text-shadow:5px 5px 0 var(--ink),-2px -2px 0 var(--ink);animation:psy .45s ease-in-out infinite alternate;transition:font-size .3s}
.mq-psy.small{font-size:clamp(30px,6vw,64px);animation:none}
.mq-kid{position:relative;font:700 clamp(20px,3vw,34px)/1.3 var(--disp);color:#fff;max-width:760px;text-shadow:2px 2px 0 var(--ink);animation:pop .5s}
.mq-vid{position:relative;width:min(100%,860px);animation:pop .5s}
.mq-frame{position:relative;aspect-ratio:16/9;border:4px solid var(--ink);border-radius:14px;overflow:hidden;background:#000}
.mq-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mq-alt{margin:8px 0 0;font-size:14px}.mq-alt a{color:#fff;text-decoration:underline;font-weight:700}

/* ---------- GAME 5: forever ---------- */
.fv{position:relative;min-height:60vh;display:grid;place-items:center;border-radius:20px;overflow:hidden;border:3px solid var(--ink);background:linear-gradient(#fff,var(--pink))}
.fv-inf{width:min(70%,460px);overflow:visible}
.fv-line{stroke:var(--red);stroke-width:7;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3s ease-in-out forwards}
.fv-t{position:absolute;bottom:14%;font:700 clamp(30px,6vw,64px) var(--disp);color:var(--red);text-shadow:3px 3px 0 var(--ink);animation:pop .6s 2.4s both}
.fv-h{position:absolute;bottom:-40px;color:var(--red);opacity:.5;animation:risehearts linear infinite}

/* ---------- GAME 10: tiktok ---------- */
.g10{text-align:center}
.g10.shake{animation:shk .45s}
.tk-top{display:flex;flex-direction:column;align-items:center;gap:12px;margin:6px 0 10px}
.tk-prof{width:min(560px,94%);border-radius:16px;border:3px solid var(--ink);background:#000;display:block}
.tk-fallback{background:#000;color:#fff;padding:20px;border-radius:14px}
.tk-top h3{margin:6px 0 0;font:700 clamp(24px,4vw,40px) var(--disp);color:var(--red)}
.tk-meta{font-weight:900;margin:4px 0 12px}
.tk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.tk-opt{position:relative;display:flex;flex-direction:column;gap:10px;transition:.35s}
.tk-opt.gone{opacity:0;transform:scale(.8) rotate(-4deg)}
.tk-opt.right .tk-screen{outline:5px solid #2ec27e}
.tk-badge{position:absolute;left:-6px;top:-8px;z-index:3;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:18px}
.tk-screen{position:relative;aspect-ratio:9/16;background:#000;border-radius:14px;overflow:hidden;border:3px solid var(--ink);cursor:pointer}
.tk-screen video{width:100%;height:100%;object-fit:contain;display:block}
.tk-play{position:absolute;inset:0;margin:auto;width:62px;height:62px;border-radius:50%;background:rgba(217,4,41,.9);color:#fff;display:grid;place-items:center;font-size:24px;padding-left:4px;transition:opacity .2s;pointer-events:none}
.tk-play.hide{opacity:0}
.tk-miss{position:absolute;inset:0;display:grid;place-items:center;padding:12px;color:#fff;font-size:12px;font-weight:700;background:var(--deep)}
.tk-pick{border:0;background:var(--red);color:#fff;font-weight:900;padding:11px;border-radius:10px;box-shadow:0 4px 0 var(--deep);font-size:16px}
.tk-pick:active{transform:translateY(3px);box-shadow:none}
.tk-done{margin-top:26px;font:700 clamp(24px,4vw,40px) var(--disp);color:var(--red)}
@media (max-width:760px){.tk-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- GAME 11: sticky notes ---------- */
.sn-h{text-align:center;margin:8px 0 6px;font:700 clamp(30px,5vw,50px) var(--hand);color:var(--red)}
.sn-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:30px 26px;padding:24px clamp(8px,2vw,24px) 30px;border-radius:20px;border:3px solid var(--ink);background:linear-gradient(rgba(217,4,41,.1) 1px,transparent 1px) 0 0/100% 28px,linear-gradient(90deg,rgba(217,4,41,.1) 1px,transparent 1px) 0 0/28px 100%,#fff}
.sn{position:relative;min-height:200px;padding:34px 22px 28px;font-family:var(--hand);font-size:clamp(21px,2.1vw,26px);line-height:1.3;border:3px solid var(--ink);border-radius:6px 26px 8px 28px/28px 8px 26px 6px;box-shadow:7px 8px 0 rgba(20,9,11,.18);transform:rotate(var(--rot));opacity:0;animation:snPop .6s cubic-bezier(.2,1.3,.4,1) forwards}
.sn.long{grid-column:span 2}
@media (max-width:600px){.sn.long{grid-column:auto}}
.sn.c0{background:#fff}.sn.c1{background:var(--pink)}.sn.c2{background:var(--pink2)}.sn.c3{background:#fff0f1}
.sn .tape{position:absolute;left:50%;top:-14px;width:84px;height:26px;margin-left:-42px;background:rgba(217,4,41,.45);border:2px solid rgba(20,9,11,.5);transform:rotate(-3deg)}
.sn-from{font-weight:700;color:var(--red);font-size:1.1em;margin-bottom:6px}
.sn p{margin:0;overflow-wrap:anywhere}
.sn p i{opacity:.85}
.sn-d{position:absolute;color:var(--red);font-size:26px;opacity:.7}.sn-d.d1{right:12px;bottom:8px;transform:rotate(14deg)}.sn-d.d2{left:12px;bottom:6px;transform:rotate(-12deg);font-size:20px}

/* ---------- GAME 12: marvel quiz ---------- */
.mv-wrap{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:20px;align-items:start}
.mv-side{position:sticky;top:calc(var(--top) + 12px);background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px 12px;box-shadow:6px 6px 0 var(--ink)}
.mv-sh{font:700 18px var(--disp);margin-bottom:10px;text-align:center}
.mv-word{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;align-items:flex-end}
.mv-slot{width:28px;height:34px;border-radius:7px;border:2px dashed rgba(255,255,255,.55);display:grid;place-items:center;font:900 20px var(--disp);color:var(--red)}
.mv-slot.on{background:#fff;border:2px solid var(--ink);animation:plpop .5s cubic-bezier(.2,1.6,.4,1)}
.mv-comma{font:900 26px var(--disp);line-height:1}
.mv-main{text-align:center}
.mv-main.shake{animation:shk .4s}
.mv-count{font-weight:900;color:var(--red);margin-bottom:10px}
.mv-frame{width:min(100%,420px);aspect-ratio:3/4;margin:auto;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--pink);box-shadow:8px 8px 0 var(--red)}
.mv-img{width:100%;height:100%;object-fit:cover;display:block}
.mv-miss{width:100%;height:100%;display:grid;place-content:center;gap:6px;background:linear-gradient(135deg,var(--red),var(--deep));color:#fff}
.mv-miss b{font:900 90px var(--disp)}.mv-miss small{font-size:13px;padding:0 10px}

.mv-in{width:min(320px,100%);padding:13px 16px;font:700 18px 'Nunito',sans-serif;border:3px solid var(--ink);border-radius:12px;outline:none}

/* typewriter */
function typeInto(el, text, speed = 26, skipTarget) {
  return new Promise(res => {
    let i = 0, done = false;
    el.textContent = '';
    const caret = h('span', { class: 'caret' });
    el.append(caret);
    const fin = () => { if (done) return; done = true; clearInterval(iv); el.textContent = text; res(); };
    const iv = setInterval(() => {
      i++;
      el.textContent = text.slice(0, i); el.append(caret);
      if (i % 3 === 0) SFX.tick && 0;
      if (i >= text.length) fin();
    }, speed);
    (skipTarget || el).addEventListener('click', fin, { once: true });
    state.gameClean.push(() => { done = true; clearInterval(iv); });
  });
}

      if (good) {
        f.alive = false; caught++; SFX.pop();
        el.classList.add('caught'); setTimeout(() => el.remove(), 500);
        counter.textContent = `Caught ${caught} / ${TOTAL}`;
        if (caught === TOTAL) finish();
      } else {
        SFX.oops(); field.classList.remove('nope'); void field.offsetWidth; field.classList.add('nope');
        hint.textContent = 'Oops, that one isn\'t pink or purple!';
        el.classList.add('wiggle'); setTimeout(() => el.classList.remove('wiggle'), 500);
      }
    });
    field.append(el); flies.push(f);
  };
  for (let i = 0; i < TOTAL; i++) make(true, i % 2 ? pick(PINKS) : pick(PURPS), '#fff');
  for (let i = 0; i < DECOYS; i++) make(false, pick(DECOY), '#fff');

  let raf, last = performance.now();
  const tick = now => {
    const dt = Math.min(2.2, (now - last) / 16.7); last = now;
    const W = field.clientWidth, H = field.clientHeight;
    flies.forEach(f => {
      if (!f.alive) return;
      f.ph += .03 * dt;
      f.vx += Math.sin(f.ph * 1.7 + f.x * .01) * .05 * dt;
      f.vy += Math.cos(f.ph * 1.3 + f.y * .01) * .05 * dt;
      const sp = Math.hypot(f.vx, f.vy), max = 1.5;
      if (sp > max) { f.vx *= max / sp; f.vy *= max / sp; }
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.x < 0) { f.x = 0; f.vx = Math.abs(f.vx); } if (f.x > W - 60) { f.x = W - 60; f.vx = -Math.abs(f.vx); }
      if (f.y < 0) { f.y = 0; f.vy = Math.abs(f.vy); } if (f.y > H - 50) { f.y = H - 50; f.vy = -Math.abs(f.vy); }
      const ang = Math.atan2(f.vy, f.vx) * 180 / Math.PI + 90;
      f.el.style.transform = `translate(${f.x}px,${f.y}px) rotate(${ang}deg)`;
    });
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  ctx.onLeave(() => cancelAnimationFrame(raf));

  function finish() {
    over = true; SFX.win(); confetti(50, root, ['🦋', '💜', '💗', '✨']);
    hint.textContent = 'You caught them all!';
    setTimeout(() => { msg.hidden = false; msg.classList.add('show'); msg.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 700);
    setTimeout(() => ctx.showNext(), 2600);
  }
};

  let first = null, lock = false, found = 0, moves = 0;
  const info = h('div', { class: 'mt-info' }, 'Find the matching letters: I, L, O, V, E, Y, U');
  const grid = h('div', { class: 'mt-grid' });

  root.append(info, grid, stageText);
  deck.forEach(L => {

      h('span', { class: 'f front', html: '♡' }), h('span', { class: 'f back' }, L));
    c.onclick = () => {
      if (lock || c.classList.contains('flip') || c.classList.contains('done')) return;
      c.classList.add('flip'); SFX.tick();
      if (!first) { first = c; return; }
      moves++; lock = true;
      if (first.dataset.l === c.dataset.l) {
        const a = first; first = null;
        setTimeout(() => { a.classList.add('done'); c.classList.add('done'); SFX.match(); lock = false; found++; if (found === letters.length) done(); }, 350);
      } else {
        const a = first; first = null;
        setTimeout(() => { a.classList.remove('flip'); c.classList.remove('flip'); lock = false; }, 800);
      }
    };
    grid.append(c);
  });

  async function done() {
    info.textContent = `All matched in ${moves} tries!`;
    await sleep(700);

/* =========================================================

   ========================================================= */
GAMES[9] = function (ctx) {
  const root = ctx.root;
  const CORRECT = [1, 0, 3, 0, 2, 0, 1, 3];   // 0=A 1=B 2=C 3=D
  const L = ['A', 'B', 'C', 'D'];
  let round = 0;
  const top = h('div', { class: 'tk-top' },
    smartImg(local('profile/tiktok-layout'), () => h('div', { class: 'tk-fallback' }, 'rri · hiddensoulch · 38 Following · 23 Followers · 48 Likes'), 'tk-prof'),
    h('h3', {}, 'guess which videos you reposted?'));
  const meta = h('div', { class: 'tk-meta' });
  const grid = h('div', { class: 'tk-grid' });
  const done = h('div', { class: 'tk-done', hidden: '' }, 'You remembered them all ♡');
  root.append(top, meta, grid, done);

  const vids = [];
  const pauseAll = except => vids.forEach(v => { if (v !== except) v.pause(); });
  ctx.onLeave(() => vids.forEach(v => v.pause()));

  function load() {
    grid.innerHTML = ''; vids.length = 0;
    meta.textContent = `#${round + 1} of ${CORRECT.length}`;
    L.forEach((letter, k) => {
      const vname = `q${round + 1}-${letter}`;
      const vc = [videoFile('videos', [vname, `${round + 1}${letter}`]), encodeURI(`videos/${vname}.mp4.mp4`), encodeURI(`videos/${vname}.mp4 (CORRECT).mp4`), encodeURI(`videos/${vname}.mp4`)].filter(Boolean);
      let vi = 0;
      const v = h('video', { src: vc[0], preload: 'metadata', loop: '' });
      v.setAttribute('playsinline', '');
      vids.push(v);
      const play = h('div', { class: 'tk-play' }, '▶');
      const missing = h('div', { class: 'tk-miss', hidden: '' }, `Video file missing: videos/q${round + 1}-${letter}.mp4`);
      v.addEventListener('error', () => { if (++vi < vc.length) { v.src = vc[vi]; v.load(); } else { missing.hidden = false; play.hidden = true; } });
      v.addEventListener('play', () => { pauseAll(v); play.classList.add('hide'); });
      v.addEventListener('pause', () => play.classList.remove('hide'));
      const screen = h('div', { class: 'tk-screen' }, v, play, missing);
      screen.onclick = () => { if (v.paused) v.play().catch(() => { }); else v.pause(); };
      const pickBtn = h('button', { class: 'tk-pick' }, `Option ${letter}`);
      const card = h('div', { class: 'tk-opt' }, h('div', { class: 'tk-badge' }, letter), screen, pickBtn);
      pickBtn.onclick = () => choose(k, card);
      grid.append(card);
    });
  }
  function choose(k, card) {
    pauseAll();
    if (k === CORRECT[round]) {
      SFX.win(); card.classList.add('right');
      setTimeout(() => {
        round++;
        if (round >= CORRECT.length) { grid.innerHTML = ''; meta.textContent = ''; done.hidden = false; confetti(40, root, ['💖', '🎵', '✨']); ctx.showNext(); }
        else load();
      }, 450);
    } else {
      SFX.oops();
      root.classList.remove('shake'); void root.offsetWidth; root.classList.add('shake');
      card.classList.add('gone');
      const v = $('video', card); if (v) v.pause();
      setTimeout(() => card.remove(), 350);
    }
  }
  load();
};

/* =========================================================
   index 11 — я тебя люблю, my cherry: guess the Marvel character
   ========================================================= */
GAMES[11] = function (ctx) {
  const root = ctx.root;
  const Q = [
    ['hulk'], ['ant-man'], ['pepper potts', 'pepper'], ['pietro', 'pietro maximoff'], ['yellowjacket'],
    ['moon knight'], ['okoye'], ['natasha', 'natasha romanoff'], ['thor'], ['hela'],
    ['spiderman', 'spider-man'], ['america', 'america chavez'], ['rocket'], ['yinsen'], ['mystique'],
    ['yondu'], ['loki', 'loki laufeyson', 'loki odinson'], ['odin'], ['vision'], ['ebony', 'ebony maw']
  ];
  const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
  const GROUPS = ['HAPPY', 'MONTHSARY,', 'MY', 'LOVE'];
  const FIRSTS = Q.map(a => a[0][0].toUpperCase());      // H A P P Y M O N T H S A R Y M Y L O V E
  let n = 0, wrong = 0;

  const side = h('aside', { class: 'mv-side' }, h('div', { class: 'mv-sh' }, 'Collected'));
  const slots = [];
  let gi = 0;
  GROUPS.forEach(g => {
    const row = h('div', { class: 'mv-word' });
    for (const ch of g) {
      if (ch === ',') { row.append(h('span', { class: 'mv-comma' }, ',')); continue; }
      const s = h('span', { class: 'mv-slot' }, '');
      slots.push(s); row.append(s);
    }
    side.append(row);
  });
  const main = h('div', { class: 'mv-main' });
  const count = h('div', { class: 'mv-count' });
  const frame = h('div', { class: 'mv-frame' });
  const input = h('input', { class: 'mv-in', type: 'text', placeholder: 'who is this?', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Your guess' });
  const go = h('button', { class: 'mv-go' }, 'guess');
  const fb = h('div', { class: 'mv-fb' });
  const hintBtn = h('button', { class: 'mv-hint', hidden: '' }, 'Need a hint?');
  main.append(count, frame, h('div', { class: 'mv-form' }, input, go), fb, hintBtn);
  root.append(h('div', { class: 'mv-wrap' }, side, main));

  function show() {
    wrong = 0; hintBtn.hidden = true; fb.textContent = ''; input.value = '';
    count.textContent = `Guess #${n + 1} of ${Q.length}`;
    frame.innerHTML = '';
    frame.append(smartImg(local('marvel/' + pad2(n + 1)), () => h('div', { class: 'mv-miss' }, h('b', {}, '?'), h('small', {}, `Add marvel/${pad2(n + 1)}.jpg`)), 'mv-img'));
    input.focus({ preventScroll: true });
  }
  function submit() {
    const g = norm(input.value);
    if (!g) return;
    if (Q[n].some(a => norm(a) === g)) {
      SFX.match();
      const s = slots[n]; s.textContent = FIRSTS[n]; s.classList.add('on');
      n++;
      fb.textContent = 'Correct ♡'; fb.className = 'mv-fb ok';
      input.disabled = go.disabled = true;
      setTimeout(() => {
        input.disabled = go.disabled = false;
        if (n >= Q.length) finale(); else { fb.className = 'mv-fb'; show(); }
      }, 800);
    } else {
      wrong++; SFX.oops();
      fb.textContent = 'Not quite — try again'; fb.className = 'mv-fb bad';
      main.classList.remove('shake'); void main.offsetWidth; main.classList.add('shake');
      if (wrong >= 3) hintBtn.hidden = false;
    }
  }
  go.onclick = submit;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  hintBtn.onclick = () => { const a = Q[n][0]; fb.textContent = `Hint: starts with "${a[0].toUpperCase()}" and has ${a.replace(/[^a-z]/g, '').length} letters`; fb.className = 'mv-fb'; };

  function finale() {
    SFX.win();
    const ov = h('div', { class: 'finale' });
    const words = h('div', { class: 'fin-words' });
    let k = 0;
    GROUPS.forEach(g => {
      const w = h('div', { class: 'fin-w' });
      for (const ch of g) w.append(h('span', { class: 'fin-l', style: `animation-delay:${(k++) * .12}s` }, ch));
      words.append(w);
    });
    ov.append(words);
    const cols = ['#ffffff', '#ffd6dc', '#ff8fa3', '#ffffff', '#ffb3c1'];
    const flies = [];
    for (let i = 0; i < 22; i++) {
      const el = h('div', { class: 'fin-bf', html: butterflySVG(pick(cols), '#fff') });
      const sz = rand(40, 90); el.style.width = sz + 'px';
      ov.append(el);
      flies.push({ el, x: rand(0, innerWidth), y: rand(0, innerHeight), vx: rand(-1.4, 1.4), vy: rand(-1.4, 1.4), ph: rand(0, 6), sz });
    }
    const back = h('button', { class: 'g-next pop fin-back' }, 'Back to home');
    back.onclick = () => { location.hash = '#/'; };
    ov.append(back);
    document.body.append(ov);
    let raf, last = performance.now();
    const tick = now => {
      const dt = Math.min(2.2, (now - last) / 16.7); last = now;
      flies.forEach(f => {
        f.ph += .03 * dt;
        f.vx += Math.sin(f.ph * 1.7) * .05 * dt; f.vy += Math.cos(f.ph * 1.3) * .05 * dt;
        const sp = Math.hypot(f.vx, f.vy); if (sp > 1.8) { f.vx *= 1.8 / sp; f.vy *= 1.8 / sp; }
        f.x += f.vx * dt; f.y += f.vy * dt;
        if (f.x < -f.sz) f.x = innerWidth; if (f.x > innerWidth) f.x = -f.sz;
        if (f.y < -f.sz) f.y = innerHeight; if (f.y > innerHeight) f.y = -f.sz;
        f.el.style.transform = `translate(${f.x}px,${f.y}px) rotate(${Math.atan2(f.vy, f.vx) * 180 / Math.PI + 90}deg)`;
      });
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    ctx.onLeave(() => { cancelAnimationFrame(raf); ov.remove(); });
  }
  show();
};
