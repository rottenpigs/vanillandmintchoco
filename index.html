<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROBLOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Patrick+Hand&family=Gaegu:wght@400;700&family=IM+Fell+English:ital@0;1&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside id="side">
  <a class="sb" href="#/" title="Home">
    <svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg><span>Home</span>
  </a>
  <a class="sb" href="#/" title="Moments">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 9 5 3-5 3z"/></svg><span>Moments</span>
  </a>
  <a class="sb" href="#/" title="Chat">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Chat</span>
  </a>
  <a class="sb" href="#/" title="Me">
    <div class="meav" id="sideAv"></div><span>Me</span>
  </a>
  <a class="sb" href="#/" title="More">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="16" cy="12" r="1"/></svg><span>More</span>
  </a>
</aside>

<header id="top">
  <a class="logo" href="#/" aria-label="Roblox home">R<i></i>BLOX</a>
  <label class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Search" autocomplete="off">
  </label>
  <div class="user">
    <div class="topav" id="topAv"></div>
    <b>ALEKSEI</b>
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><circle cx="12" cy="12" r="3"/></svg>
    <svg class="ic" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1 1 12 0v6l2 2H4z"/><path d="M10 21h4"/></svg>
  </div>
</header>

<main id="home">
  <nav class="tabs">
    <button class="tab on" data-tab="foryou">For you</button>
    <button class="tab" data-tab="charts">Charts</button>
  </nav>

  <section id="friends" class="friends" aria-label="Friends"></section>

  <h2 class="sec">Recommended For You</h2>
  <section id="movies" class="movies"></section>

  <h2 class="sec">Continue <span class="chev">&rsaquo;</span></h2>
  <section id="continue" class="continue"></section>

  <p class="foot">made with love, for you.</p>
</main>

<section id="game" hidden></section>
<div id="overlay"></div>
<div id="toast" role="status"></div>

<script src="js/core.js"></script>
<script src="js/games1.js"></script>
<script src="js/games2.js"></script>
<script src="js/games3.js"></script>
<script>route();</script>
</body>
</html>
